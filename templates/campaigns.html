{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Campaigns</h4>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Campaign</button>
</div>
<div class="card"><div class="card-body">
<table class="table table-hover">
    <thead><tr><th>#</th><th>Name</th><th>Category</th><th>Target</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>{% for c in campaigns %}<tr>
        <td>{{ loop.index }}</td><td>{{ c.name }}</td><td>{{ c.category }}</td>
        <td>Rs {{ c.target }}</td><td><span class="badge bg-success">{{ c.status }}</span></td>
        <td><form method="POST" action="/campaigns/delete/{{ c.id }}" onsubmit="return confirm('Delete?')">
            <button class="btn btn-danger btn-sm">Delete</button></form></td>
    </tr>{% endfor %}</tbody>
</table>
</div></div>
<div class="modal fade" id="addModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add Campaign</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form method="POST" action="/campaigns/add"><div class="modal-body">
        <input name="name" class="form-control mb-2" placeholder="Campaign Name" required>
        <input name="category" class="form-control mb-2" placeholder="Category">
        <input name="target" type="number" class="form-control mb-2" placeholder="Target Amount" required>
        <input name="start_date" type="date" class="form-control mb-2">
        <input name="end_date" type="date" class="form-control mb-2">
        <textarea name="description" class="form-control" placeholder="Description"></textarea>
    </div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form>
</div></div></div>
{% endblock %}
