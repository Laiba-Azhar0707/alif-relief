{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Donors</h4>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Donor</button>
</div>
<div class="card"><div class="card-body">
<table class="table table-hover">
    <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>City</th><th>Type</th><th>Action</th></tr></thead>
    <tbody>{% for d in donors %}<tr>
        <td>{{ loop.index }}</td><td>{{ d.name }}</td><td>{{ d.phone }}</td>
        <td>{{ d.email }}</td><td>{{ d.city }}</td><td>{{ d.type }}</td>
        <td><form method="POST" action="/donors/delete/{{ d.id }}" onsubmit="return confirm('Delete?')">
            <button class="btn btn-danger btn-sm">Delete</button></form></td>
    </tr>{% endfor %}</tbody>
</table>
</div></div>
<div class="modal fade" id="addModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add Donor</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form method="POST" action="/donors/add"><div class="modal-body">
        <input name="name" class="form-control mb-2" placeholder="Full Name" required>
        <input name="phone" class="form-control mb-2" placeholder="Phone" required>
        <input name="email" class="form-control mb-2" placeholder="Email">
        <input name="city" class="form-control mb-2" placeholder="City">
        <input name="cnic" class="form-control mb-2" placeholder="CNIC">
        <select name="type" class="form-control"><option>Individual</option><option>Organization</option></select>
    </div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form>
</div></div></div>
{% endblock %}
